# Test-only config: same Durable Object + D1 as production. AI and Vectorize are injected as mocks by
# the tests (they have no local simulator), so they are not declared here.
name = "ergora-specialists-gateway-test"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "KB_FTS"
database_name = "ergora-kb-fts-test"
database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "GATE_DO"
class_name = "Gate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gate"]

[vars]
GLOBAL_DAILY_LIMIT = "10"
ALERT_THRESHOLD_PCT = "80"
DAILY_LIMIT = "4"
ANON_LIMIT = "2"
IP_DAILY_LIMIT = "6"
POOLED_CIDRS = '["160.79.104.0/21"]'
POOL_ANON_LIMIT = "5"
POOL_IP_DAILY_LIMIT = "8"
VECTORIZE_MONTHLY_QUERY_BUDGET = "1000"
D1_DAILY_ROWS_READ_BUDGET = "4000000"
CACHE_TTL_SEC = "86400"
CONFIRM_DAILY_LIMIT = "2"
HEALTH_TTL_SEC = "300"
HEALTH_QUERY_TTL_SEC = "1800"
ATTRIBUTION_URL = "https://ergora.app"
PUBLIC_BASE_URL = "https://mcp.example.test"
UPTIME_HUB_URL = "https://hub.example.test"
LOOPS_CONFIRM_TEMPLATE_ID = "tmpl_test"
UPTIME_HUB_TOKEN = "test-hub-token"
LOOPS_API_KEY = "test-loops-key"
