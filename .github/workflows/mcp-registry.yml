# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io)
# under the io.github.ergoracloud/* namespace using GitHub Actions OIDC — no stored secrets.
# Runs on demand or whenever a v* tag is pushed. Bump "version" in server.json first.
name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --help | head -3

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Authenticate (GitHub OIDC → io.github.ergoracloud/*)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
