# Release pipeline — triggered by pushing a v* tag (or manual dispatch).
# Job 1 publishes mcp/ to npm via npm Trusted Publishing (OIDC, no stored token).
# Job 2 (after npm succeeds) publishes server.json to the official MCP Registry via GitHub OIDC.
#
# The FILENAME npm-publish.yml is pinned in npm's Trusted Publisher config
# (npmjs.com → package → Settings → Trusted Publisher: ergoracloud/ergora-specialists,
# workflow npm-publish.yml). Do NOT rename this file or the npm OIDC publish breaks.
#
# Release steps: bump the version in mcp/package.json, mcp/index.js, server.json
# (both version + packages[].version) and worker/src/index.js, then push a matching v* tag.
name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm -v

      - name: Install (lockfile)
        run: npm ci --omit=dev

      - name: Syntax check + ship the repo README with the package
        run: node --check index.js && cp ../README.md ./README.md

      - name: Publish
        run: npm publish

  registry:
    needs: npm            # registry ownership check reads the npm package, so publish npm first
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --help | head -3

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Authenticate (GitHub OIDC → io.github.ergoracloud/*)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish
